schema_version: 1
owner:
  name: "Lada"
  confirms_merge: true
data_dir: "data"
delivery: clipboard
timezone: "UTC"
bots: []
projects:
  - id: demo-quiet
    title: "Demo Quiet"
    lead: quiet1
    owner: owner
    merge_executor: quiet1
    source:
      files:
        path: "demo-project"
    chats:
      - id: hush
        title: "Тишина"
        lead: quiet1
        members: [quiet1]
        rules:
          do: "ждать ботов"
          dont: "выдумывать команду"
        context: []
        economy:
          wake: mentioned_only
          reply_limit: short
economy:
  defaults:
    wake: mentioned_only
    reply_limit: short
    max_wakes_per_task: 3
  stale_after_hours: 6
