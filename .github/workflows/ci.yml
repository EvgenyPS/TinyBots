name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: npm ci
        run: npm ci
      - name: tsc -b
        run: npx tsc -b
      - name: JSON Schema свежая
        run: node packages/schema/dist/emit.js
      - name: JSON Schema без расхождений
        run: git diff --exit-code -- packages/schema/json
      - name: eslint
        run: npx eslint .
      - name: vitest
        run: npx vitest run
      - name: движение CSS
        run: node scripts/check-motion.mjs
      - name: каталог браузеров Playwright
        id: pw-browsers
        shell: bash
        run: |
          # Вне репозитория: файл .links хранит абсолютный путь и роняет стоп-лист.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "dir=${LOCALAPPDATA}/ms-playwright" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${HOME}/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
          fi
      - name: кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ${{ steps.pw-browsers.outputs.dir }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: браузер Playwright
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: браузер Playwright
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: e2e
        run: npm run e2e
      - name: LICENSE и NOTICE
        run: node scripts/check-license.mjs
      - name: стоп-лист
        run: node scripts/check-forbidden.mjs
        env:
          FORBIDDEN_EXTRA: ${{ secrets.FORBIDDEN_EXTRA }}
      - name: gitleaks
        run: node scripts/run-gitleaks.mjs

  perf:
    name: lighthouse и fps (ubuntu, node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm ci
        run: npm ci
      - name: tsc -b
        run: npx tsc -b
      - name: сборка страницы
        run: npm run build -w @tinybots/web
      - name: каталог браузеров Playwright
        id: pw-browsers
        shell: bash
        run: echo "dir=${HOME}/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
      - name: кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ${{ steps.pw-browsers.outputs.dir }}
          key: playwright-Linux-${{ hashFiles('package-lock.json') }}
      - name: браузер Playwright
        run: npx playwright install --with-deps chromium
      - name: lighthouse
        run: npm install --no-save lighthouse@12.8.2
      - name: Lighthouse Performance
        run: node scripts/perf-lighthouse.mjs
      - name: fps орбиты
        run: npx playwright test e2e/perf
        env:
          TINYBOTS_PERF: '1'

  desktop:
    name: установщик Tauri (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: npm ci
        run: npm ci
      - name: sidecar и страница
        run: node scripts/prepare-desktop.mjs
      - name: keyring из SEA
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/binaries/tinybots-server-*.exe | Select-Object -First 1
          if (-not $exe) { throw 'sidecar не собран' }
          & $exe.FullName --keyring-selftest 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\keyring-selftest.txt"
          Write-Host "KEYRING_SELFTEST_EXIT $LASTEXITCODE"
          $text = Get-Content "$env:RUNNER_TEMP\keyring-selftest.txt" -Raw
          if ($text -match 'KEYRING_SEA_OK') { Write-Host 'KEYRING_SEA_OK' }
          if ($text -match 'KEYRING_SEA_FAIL load|KEYRING_LOAD_FAIL|KEYRING_SEA_FAIL missing') {
            Write-Host 'KEYRING_LOAD_BLOCKED'
          }
      - name: установщик NSIS
        working-directory: apps/desktop
        run: npx tauri build
      - name: размер установщика
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse apps/desktop/src-tauri/target/release/bundle -Filter *setup*.exe | Select-Object -First 1
          if (-not $file) { throw 'установщик не найден' }
          Write-Host "INSTALLER_PATH $($file.FullName)"
          Write-Host "INSTALLER_BYTES $($file.Length)"
          $dest = Join-Path $env:RUNNER_TEMP 'tinybots-installed'
          $proc = Start-Process -FilePath $file.FullName -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          Write-Host "INSTALL_EXIT $($proc.ExitCode)"
          if (Test-Path $dest) {
            $sum = (Get-ChildItem -Recurse -File $dest | Measure-Object Length -Sum).Sum
            Write-Host "INSTALLED_BYTES $sum"
            Get-ChildItem $dest | ForEach-Object { Write-Host "INSTALLED_TOP $($_.Name)" }
          } else {
            Write-Host 'INSTALLED_DIR_MISSING'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tinybots-windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
