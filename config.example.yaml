# Пример конфига TinyBots. Скопируйте в config.yaml и подставьте свои значения.
# Токены, ключи и пути к ним сюда не писать — только в .env.
# Схему проверяет пакет @tinybots/schema. Мастер настройки пишет config.yaml сам, если файла ещё нет.

schema_version: 1

owner:
  name: "Alex"
  confirms_merge: true

data_dir: "./data" # очередь, записки, запросы на мерж
delivery: clipboard # clipboard | queue

bots: # grok_id — вымышленный id для ссылки grokbot://app/v1/agent?id=<grok_id>
  - id: lead1
    name: "Ава"
    role: "тимлид"
    avatar: "assets/ava.svg"
    grok_id: "demo-ava"
  - id: dev1
    name: "Бит"
    role: "код"
    executor_for_merge: true
    grok_id: "demo-bit"
  - id: qa1
    name: "Тэст"
    role: "проверка"
    grok_id: "demo-test"
  - id: rev1
    name: "Рев"
    role: "ревизор"
    paused: false
    grok_id: "demo-rev"
  # Свой бот. Значения ключа здесь нет: только имя переменной из .env.
  # Пресет deepseek без base_url подставляет https://api.deepseek.com
  # Пресет qwen без base_url подставляет https://dashscope.aliyuncs.com/compatible-mode/v1
  # base_url можно заменить на другой проверенный OpenAI-совместимый адрес.
  - id: nora
    name: "Нора"
    role: "справка"
    instructions: "Отвечай по карточке задачи. Чужие чаты не пересказывай."
    provider: deepseek
    model: deepseek-chat
    base_url: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY

projects:
  - id: demo-game
    title: "Demo Game"
    lead: lead1
    owner: owner # единственный, кто подтверждает мерж
    merge_executor: dev1
    source:
      git:
        provider: github
        repo: "example/demo-game" # или null
      files:
        path: "./demo-project"
    chats:
      - id: build
        title: "Сборка"
        lead: dev1
        members: [dev1, qa1, rev1, lead1, nora]
        rules:
          do: "код, тесты, ревью"
          dont: "оформление, посты"
        context:
          - "src/app.txt"
          - "notes/goals.md"
        economy:
          wake: mentioned_only
          reply_limit: short

economy:
  defaults:
    wake: mentioned_only
    reply_limit: short
    max_wakes_per_task: 3 # ответ короткий, бриф короткий, пробуждений не больше трёх
  stale_after_hours: 6
