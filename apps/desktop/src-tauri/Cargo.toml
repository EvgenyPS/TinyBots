[package]
name = "tinybots-desktop"
version = "0.3.3"
description = "Окно TinyBots"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tinybots_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tinybots-nav = { path = "../nav" }
tinybots-log = { path = "../log" }
getrandom = "0.2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
